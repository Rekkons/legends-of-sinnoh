<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>{{{ PRODUCT_NAME }}}</title>
    <link rel="icon" href="favicon.ico">
    <!-- M7 웹 손님(02 §8, isekai WebGLTemplates/Isekai를 고쳐 옮김): 캔버스가 브라우저 창을 꽉 채운다. 받기 막대 = 엔진(0~50%) + Gen 번들 첫 받기(50~100% — WebContent → window.sinnohLoading) -->
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #101418; }
      #unity-canvas { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; background: #101418; outline: none; }
      #loading { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(420px, 70vw); text-align: center;
                 color: #e8e4d8; font: 14px/1.5 sans-serif; z-index: 5; }
      #loading-track { margin-top: 10px; height: 10px; border: 1px solid #6a7a88; border-radius: 6px; overflow: hidden; background: #1c242c; }
      #loading-fill { width: 0%; height: 100%; background: #f0c850; transition: width 0.15s linear; }
      #loading-hint { margin-top: 6px; color: #a8b0b8; font-size: 13px; }
      #notice { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(420px, 86vw); display: none; text-align: center;
                color: #e8e4d8; font: 15px/1.6 sans-serif; }
      #notice-title { font-size: 20px; font-weight: bold; margin-bottom: 10px; color: #f0c850; }
      #notice-go { margin-top: 18px; padding: 8px 16px; font: 14px sans-serif; color: #e8e4d8; background: #1c242c; border: 1px solid #6a7a88; border-radius: 6px; }
      #banner { position: fixed; left: 0; right: 0; top: 0; display: none; z-index: 10; font: 14px/1.5 sans-serif; }
      #banner div { padding: 10px; color: #111; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">
      <div>{{{ PRODUCT_NAME }}}</div>
      <div id="loading-track"><div id="loading-fill"></div></div>
      <div id="loading-text">0%</div>
      <div id="loading-hint">처음에는 시간이 걸립니다. 새로 고치지 마십시오.</div>
    </div>
    <!-- 폰·태블릿 브라우저는 범위 밖(2026-11-05). 받기 전에 안내하고, 원하면 그래도 연다 -->
    <div id="notice">
      <div id="notice-title">PC 브라우저에서 열어 주십시오</div>
      <div>폰·태블릿 브라우저는 지원하지 않습니다. 마우스와 가로로 넓은 화면에 맞춰 만들었습니다.</div>
      <button id="notice-go" type="button">그래도 열기</button>
    </div>
    <div id="banner"></div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loading = document.querySelector("#loading");
      var loadingFill = document.querySelector("#loading-fill");
      var loadingText = document.querySelector("#loading-text");
      var loadingHint = document.querySelector("#loading-hint");
      var notice = document.querySelector("#notice");
      var banner = document.querySelector("#banner");
      // 가운데 클릭(e.button 1)의 자동 스크롤·붙여넣기, 캔버스에서 Alt만 눌렀다 뗄 때 브라우저 메뉴를 막는다(Unity는 같은 이벤트를 그대로 받는다)
      canvas.addEventListener("mousedown", function (e) { if (e.button === 1) e.preventDefault(); });
      canvas.addEventListener("auxclick", function (e) { if (e.button === 1) e.preventDefault(); });
      ["keydown", "keyup"].forEach(function (t) { window.addEventListener(t, function (e) { if (e.key === "Alt" && document.activeElement === canvas) e.preventDefault(); }); });

      // 경고는 잠깐, 오류는 계속 위에 띄운다(기본 템플릿 unityShowBanner와 같은 약속)
      function showBanner(msg, type) {
        var div = document.createElement("div");
        div.textContent = msg;
        div.style.background = type == "error" ? "#e05050" : "#e8d070";
        banner.appendChild(div);
        banner.style.display = "block";
        if (type != "error") setTimeout(function () {
          banner.removeChild(div);
          banner.style.display = banner.children.length ? "block" : "none";
        }, 5000);
      }

      function setProgress(p, label) {
        var pct = Math.max(0, Math.min(100, Math.round(100 * p)));
        loadingFill.style.width = pct + "%";
        loadingText.textContent = label || (pct + "%");
      }

      // Gen 번들 첫 받기(C# WebContent → SinnohWeb.jslib SinnohLoading). ready = 첫 받기 끝 → 막대를 걷는다(뒤의 나눠 받기는 보이지 않게)
      window.sinnohLoading = function (done, total, ready) {
        window.sinnohBundles = { done: done, total: total, ready: !!ready };
        if (ready) { loading.style.display = "none"; canvas.focus(); return; }
        setProgress(0.5 + (total > 0 ? 0.5 * done / total : 0), "그림·소리 받는 중 " + done + " / " + total);
      };

      var buildUrl = "Build";
      var config = {
        arguments: [],
#if PROGRESSIVE_ASSET_LOADING
        primaryDataUrls: {{{ JSON.stringify(PRIMARY_DATA_FILES) }}},
        secondaryDataUrls: {{{ JSON.stringify(SECONDARY_DATA_FILES) }}},
#else
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
#endif
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: showBanner,
        // persistentDataPath(닉네임·기기 토큰)를 IndexedDB에 저장해 새로 고쳐도 남게 한다
        autoSyncPersistentDataPath: true,
      };

      function isPhone() {
        var ua = navigator.userAgent || "";
        if (/Android|iPhone|iPad|iPod|Mobile|Windows Phone/i.test(ua)) return true;
        if (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) return true;
        return navigator.maxTouchPoints > 0 && window.innerHeight > window.innerWidth;
      }

      function start() {
        notice.style.display = "none";
        loading.style.display = "block";
        var script = document.createElement("script");
        script.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
        script.onload = function () {
          createUnityInstance(canvas, config, function (progress) {
            // 엔진 받기는 막대의 앞 절반. 다 받은 뒤 엔진을 준비하는 동안 오래 멈춘다
            setProgress(0.5 * progress, progress >= 0.9 ? "준비 중…" : null);
          }).then(function (instance) {
            window.sinnohInstance = instance;
            if (!(window.sinnohBundles && window.sinnohBundles.ready)) setProgress(0.5, "그림·소리 받는 중…");
          }).catch(function (message) {
            loading.style.display = "none";
            showBanner(String(message), "error");
          });
        };
        script.onerror = function () { showBanner("로더를 받지 못했습니다: " + script.src, "error"); };
        document.body.appendChild(script);
      }

      if (isPhone()) {
        loading.style.display = "none";
        notice.style.display = "block";
        document.querySelector("#notice-go").onclick = start;
      } else {
        start();
      }
    </script>
  </body>
</html>
